[package]
name = "msh-deckbuilder"
version = "0.1.0"
edition = "2024"

[dependencies]
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
strip = true
lto = true
